[package]
name = "ccinrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A C compiler with gcc's command line, built on cinrs: the C becomes Rust, which rustc compiles and links"
readme = "README.md"
keywords = ["c", "compiler", "gcc", "cinrs", "transpiler"]
categories = ["command-line-utilities", "compilers", "development-tools"]

include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[[bin]]
name = "ccinrs"
path = "src/main.rs"

[dependencies]
# The front end, used as a library: `translate_file` reads a `.c` file and
# hands back the Rust and the diagnostics, which this crate renders itself.
cinrs-core.workspace = true
# Only for its source text, which `ccinrs` compiles with the user's `rustc`
# for the programs that use the complex types; see `runtime`.
cinrs-rt = { workspace = true, features = ["sources"] }
# The token stream `translate_file` returns; printing it is the `.rs` file
# `rustc` is given.
proc-macro2.workspace = true
quote.workspace = true
# Reading that token stream as items, to put them in the order of the C lines
# they came from before printing them; see `print`.
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
# `-S`: the Rust a C file becomes, formatted to be read.
prettyplease = "0.3.0"
