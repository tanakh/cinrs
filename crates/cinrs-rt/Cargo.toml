[package]
name = "cinrs-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The tiny no_std runtime the code cinrs generates links against: C's complex arithmetic, Annex G and all"
documentation = "https://docs.rs/cinrs-rt"
readme = "README.md"
keywords = ["c", "complex", "no-std", "runtime", "cinrs"]
categories = ["no-std", "development-tools::ffi", "mathematics"]

include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "cinrs_rt"

[features]
default = ["num-complex", "sources"]
# `SOURCES`: this crate's own source as text, which `ccinrs` compiles. A
# feature because the copy `ccinrs` compiles must not include its own files
# again — the Rust file `ccinrs -S` writes carries the crate without them.
sources = []

[dependencies]
# The complex number type. `default-features = false` drops `std`, which is
# what keeps this crate `no_std`; `Complex<T>` is `#[repr(C)]` and `Copy`, so
# `Complex<f64>` has exactly the layout and the calling convention of C's
# `double _Complex` on every ABI this crate targets.
#
# Optional only for `ccinrs`, which compiles this crate's source with no
# Cargo and so with no dependencies; without it the crate has a `Complex`
# of its own, with the same layout (see `src/standalone.rs`).
num-complex = { workspace = true, optional = true }
