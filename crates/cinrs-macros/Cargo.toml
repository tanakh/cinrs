[package]
name = "cinrs-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The procedural macros of the cinrs crate: c99!, gnu11!, include_c99! and the other entry points"
documentation = "https://docs.rs/cinrs-macros"
readme = "README.md"
keywords = ["c", "c99", "proc-macro", "macro", "cinrs"]
categories = ["development-tools::ffi", "compilers"]

include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "cinrs_macros"
proc-macro = true

[features]
# C's complex types. The `cinrs` crate turns this on with its own `complex`
# feature, which also supplies the runtime the generated code names.
complex = ["cinrs-core/complex"]

# Point diagnostics at the exact bytes inside a string-literal `c99!` body,
# using `proc_macro::Literal::subspan`. Needs a nightly compiler: the feature
# turns on `#![feature(proc_macro_span)]`.
nightly = []

[dependencies]
cinrs-core.workspace = true
proc-macro2.workspace = true

# Without `nightly`: it documents nothing, and would tie the docs.rs build to
# an unstable feature gate.
[package.metadata.docs.rs]
features = ["complex"]
