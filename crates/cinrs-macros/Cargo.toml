[package]
name = "cinrs-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macro front end for cinrs"

[lib]
name = "cinrs_macros"
proc-macro = true

[features]
# Point diagnostics at the exact bytes inside a string-literal `c99!` body,
# using `proc_macro::Literal::subspan`. Needs a nightly compiler: the feature
# turns on `#![feature(proc_macro_span)]`.
nightly = []

[dependencies]
cinrs-core.workspace = true
proc-macro2.workspace = true

[package.metadata.docs.rs]
features = ["nightly"]
