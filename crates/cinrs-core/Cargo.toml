[package]
name = "cinrs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The C front end behind the cinrs crate: lexer, preprocessor, parser, semantic analysis, code generation"
documentation = "https://docs.rs/cinrs-core"
readme = "README.md"
keywords = ["c", "c99", "parser", "compiler", "cinrs"]
categories = [
    "development-tools::ffi",
    "compilers",
    "parser-implementations",
]

# The bundled headers are `include_str!`-ed by `src/include.rs`, so every one of
# them has to be in the package or the crate does not build from its tarball.
# The snapshot tests and their inputs are not: they are 700 KiB of blessed
# output that no consumer of the `.crate` runs.
include = [
    "/src/**/*.rs",
    "/include/**/*.h",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "cinrs_core"

[features]
# C's complex types. All the feature does is decide what
# [`Options::complex`] defaults to: the front end carries the support either
# way, so a test can ask for both states. What the feature really stands for is
# the runtime the *generated* code needs, which the `cinrs` crate's own
# `complex` feature supplies.
complex = []

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
rustversion.workspace = true
# C99's extended identifiers are UAX #31, and so are Rust's; `unicode-ident` is
# the table `proc-macro2` itself uses to answer the same question, and
# `unicode-normalization` is what says whether an identifier is in NFC — which
# both C23 and Rust require, and which `rustc` silently *applies* to a
# procedural macro's identifiers, so a front end that did not check would let
# two different C names become one Rust item.
unicode-ident.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
insta = "1.48.0"
prettyplease = "0.3.0"
syn = { version = "3.0.6", features = ["full", "parsing", "printing"] }

[package.metadata.docs.rs]
features = ["complex"]
