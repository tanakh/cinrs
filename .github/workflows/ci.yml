name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # `scripts/ci.sh` is the whole recipe — formatting, clippy, the tests, the
    # `--no-default-features` build and the documentation — under the address
    # space and clock ceilings this project does not run anything without.
    #
    # The GCC and Clang corpora are deliberately *not* fetched: they are tens of
    # megabytes of someone else's repository, and the harnesses that read them
    # skip themselves, successfully and with a note in the log, when they are
    # absent. c-testsuite is a submodule and small, so `submodules: true` brings
    # it and its harness runs for real.
    #
    # gcc and clang are on ubuntu-latest already; the tests that compile and run
    # C for comparison need them.
    name: ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Versions
        run: |
          rustc --version
          cc --version | head -1
          clang --version | head -1
      - run: scripts/ci.sh

  portability:
    # The job above is the whole test suite, on the platform `cinrs` is
    # developed on. This one answers a narrower question on the other two:
    # does what the README shows build, link against the platform's C library
    # and run? The examples call `printf`; the test files are the ones with no
    # platform in them, and `scripts/portability-tests.txt` is the list — read
    # here and by `scripts/test-windows-from-wsl.sh`, so that a maintainer's
    # local Windows run and this job cannot drift apart. It says what is in it
    # and what is left out and why.
    #
    # `tests/portability.rs` is the one written for this job: the bundled
    # headers are cinrs's and the C library is the platform's, and only a
    # program built, linked and run here says whether the two agree.
    #
    # Every step after the toolchain runs even when an earlier one failed, so
    # that one run reports everything that is wrong on a platform rather than
    # the first thing: a link error in the examples would otherwise hide
    # whatever the tests have to say about the same library.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - if: ${{ !cancelled() }}
        run: rustc -vV
      - if: ${{ !cancelled() }}
        run: cargo run --locked --example readme
      - if: ${{ !cancelled() }}
        run: cargo run --locked --example fact
      # `bash` on both runners — Git Bash on the Windows one — so that one
      # command reads the list on either.
      - if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=()
          while read -r name; do
              # A Windows checkout may have given the list CRLF line endings.
              name=${name%$'\r'}
              case "$name" in ''|'#'*) continue ;; esac
              args+=(--test "$name")
          done < scripts/portability-tests.txt
          echo "running $((${#args[@]} / 2)) test files, two tests at a time"
          cargo test --locked -p cinrs "${args[@]}" -- --test-threads=2
