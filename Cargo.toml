[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tanakh/cinrs"
description = "Write C code inside Rust"

[workspace.dependencies]
cinrs-core = { path = "crates/cinrs-core", version = "0.1.0" }
cinrs-macros = { path = "crates/cinrs-macros", version = "0.1.0" }
cinrs-rt = { path = "crates/cinrs-rt", version = "0.1.0" }
# `Complex<T>` is `#[repr(C)]` and `Copy`, which is what makes it C's
# `_Complex`; `default-features = false` is what keeps `cinrs-rt` `no_std`.
num-complex = { version = "0.4.6", default-features = false }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0"
rustversion = "1.0.22"
unicode-ident = "1.0"
unicode-normalization = { version = "0.1.24", default-features = false }

[package]
name = "cinrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "README.md"

[features]
default = ["complex"]

# C's complex types. On by default; switching it off — `default-features =
# false` — drops the `cinrs-rt` dependency, predefines `__STDC_NO_COMPLEX__`,
# and makes `_Complex` a diagnostic again. See the crate documentation.
#
# `cinrs-core` is named twice over: `cinrs-macros` is a procedural macro and is
# therefore built for the *host*, which Cargo's feature resolver keeps apart
# from the ordinary graph, so the copy `tests/clang_c.rs` and `tests/headers.rs`
# drive directly needs the feature said again.
complex = ["dep:cinrs-rt", "cinrs-macros/complex", "cinrs-core/complex"]

# Exact spans inside string-literal input; see the crate documentation.
# Needs a nightly compiler.
nightly = ["cinrs-macros/nightly"]

[dependencies]
cinrs-macros.workspace = true
# The runtime the generated code links against; see `cinrs_rt`. `no_std`, and
# pulled in only by the `complex` feature.
cinrs-rt = { workspace = true, optional = true }

[dev-dependencies]
rustversion.workspace = true
ui_test = "0.30.7"
# `tests/clang_c.rs` runs the front end in-process: the Clang suite's reject
# cases are checked against the diagnostics and their byte ranges rather than
# by compiling anything, which is what makes a hundred and fifty files a
# fraction of a second instead of a minute.
cinrs-core.workspace = true
proc-macro2.workspace = true

[package.metadata.docs.rs]
features = ["nightly", "complex"]

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false

# The c-testsuite conformance harness; see doc/c-testsuite.md. It skips itself
# when the submodule holding the corpus has not been checked out.
[[test]]
name = "c_testsuite"
path = "tests/c_testsuite.rs"
harness = false

# The GCC torture harness; see doc/gcc-torture.md. Its corpus is fetched by
# `scripts/fetch-testsuites.sh`, and the harness skips itself without it.
[[test]]
name = "gcc_torture"
path = "tests/gcc_torture.rs"
harness = false

# The Clang C-conformance harness; see doc/clang-c-tests.md. Same arrangement.
[[test]]
name = "clang_c"
path = "tests/clang_c.rs"
harness = false

# The three harnesses' expected-failure lists are hand-edited as well as
# machine-written; this checks that every one of them parses — tags and all —
# and is written the way an update would write it. It needs no corpus.
[[test]]
name = "expected_lists"
path = "tests/expected_lists.rs"
harness = false
